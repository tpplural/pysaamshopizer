# sourcecode/compose.yaml — Shared infrastructure for Shopizer modernization
# Generated by SAAM Phase 5 setup. Updated per-service after implementation (each service
# container appended as it is built). Project name is engagement-specific (NOT "sourcecode").

name: shopizer-modern

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saam
      POSTGRES_PASSWORD: saam_local
      POSTGRES_DB: shopizer_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Each service owns its own schema in the shared dev DB (db-per-service in prod).
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/10-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saam -d shopizer_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5 of 11 services use async messaging (payment, order, cart, identity, merchant) — RabbitMQ (D-09),
  # accessed behind a broker-agnostic messaging port in each service.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: saam
      RABBITMQ_DEFAULT_PASS: saam_local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Application services appended below as each is implemented (post-service checklist) ---
  # Convention: ports 8001..8011 per services-composition.md.
  # Inter-service URLs derived from spec/microservices/<svc>/05-dependencies.md.

  # MS-01 reference-data (Wave 0) — global/tenant-neutral leaf provider; no inter-service deps.
  reference-data:
    build: ./MS-01-reference-data
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: "postgresql+psycopg://saam:saam_local@postgres:5432/shopizer_dev"
      REDIS_URL: "redis://redis:6379/0"
      SERVICE_PORT: "8001"
      DB_SCHEMA: "reference_data"
    # Run migrations then start (Dockerfile CMD is uvicorn-only; compose overrides to migrate-first).
    command: ["sh", "-c", "alembic upgrade head && uvicorn reference_data.main:app --host 0.0.0.0 --port 8001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
