# SAAM Phase 4 Stage 1.5 — Event Schema
# Compiled from the publishing service's BR-IDs (Side Effects / Data) and the consuming
# service's handler (idempotency key). Publisher and consumer 05-dependencies.md reference this file.
event: payment.captured
version: "1.0.0"
description: >
  Emitted by the payment service when a payment settles — either a single-step AuthorizeCapture,
  or the capture of a prior authorization. The order service consumes it to apply the settled
  (or "awaiting funds" for a money order) order status. Money-safety seam BV-2 / ADR-003:
  payment never writes the order directly; settlement flows through this event.

publisher: MS-10 payment
triggered_by:
  - BR-PAY-006   # order settlement signalled by event on AuthorizeCapture (money-order exception)
  - BR-PAY-007   # capture a prior authorization

consumers:
  - service: MS-09 order
    action: >
      Load the order; if paymentType == MoneyOrder mark it awaiting funds, else set it
      settled/PROCESSED and append a status-history entry (BR-ORD-009 / BR-ORD-010).
    idempotency: dedupe on transactionId (INV-ORD-007); at-least-once delivery tolerated.

channel: payment.captured
delivery:
  guarantees: at-least-once
  ordering: by orderId

payload:
  type: object
  required: [transactionId, orderId, amount, currency, transactionType, timestamp]
  properties:
    transactionId:
      type: string
      description: Ledger transaction id — the idempotency key for MS-09's consumer (INV-ORD-007).
    orderId:
      type: string
      description: The order this settlement applies to.
    amount:
      type: number
      format: double
      description: Captured amount (store currency).
    currency:
      type: string
      description: Store currency (authoritative on the payment — BR-PAY-001).
    transactionType:
      type: string
      enum: [AuthorizeCapture, Capture]
      description: AuthorizeCapture (single step) or Capture (of a prior authorization).
    paymentType:
      type: string
      enum: [CreditCard, Free, Cod, MoneyOrder, Paypal]
      description: Drives the money-order "awaiting funds" branch in MS-09.
    timestamp:
      type: string
      format: date-time

example:
  transactionId: "TX-9001"
  orderId: "ORD-5001"
  amount: 129.90
  currency: "USD"
  transactionType: "Capture"
  paymentType: "CreditCard"
  timestamp: "2026-01-01T12:00:00Z"
