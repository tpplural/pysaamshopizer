              schema: { $ref: "#/components/schemas/RelationshipGroup" }

  /relationship-groups/{code}/activate:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: code, in: path, required: true, schema: { type: string } }
    put:
      operationId: activateRelationshipGroup
      summary: Activate a group
      responses:
        "200":
          description: Updated
          content:
