openapi: "3.1.0"
info:
  title: Catalog Service API
  version: "1.0.0"
  description: |
    API contract for the catalog microservice (MS-04) of the Shopizer modernization.
    SINGLE SOURCE OF TRUTH for field names, paths, status codes, and response shapes.
    Both test suites and code generators MUST reference this file.

servers:
  - url: http://localhost:{port}/api/v1/catalog
    variables:
      port:
        default: "8004"

x-naming-conventions:
  fieldNaming: snake_case
  endpointNaming: kebab-case
  headerNaming: kebab-case
  enumValues: PascalCase
  queryParams: snake_case

# Concern B — documented exception: catalog uses x-tenant-id ONLY (store == tenant); no separate
# x-store-id. Store scoping is folded into the tenant header for this domain.
x-global-headers:
  - name: x-tenant-id
    required: true
    description: "Store isolation — all catalog queries are scoped to this store/tenant (store == tenant)"
    testValue: "test-tenant-001"
  - name: x-correlation-id
    required: false
    description: "Distributed tracing correlation id"
    testValue: "test-corr-001"

paths:
  /products:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
    get:
      operationId: listProducts
      summary: List store products
      parameters:
        - $ref: "../../shared/common-schemas.yaml#/components/parameters/PageParam"
        - $ref: "../../shared/common-schemas.yaml#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }
        "400": { $ref: "../../shared/common-schemas.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../shared/common-schemas.yaml#/components/responses/Unauthorized" }
        "500": { $ref: "../../shared/common-schemas.yaml#/components/responses/InternalError" }
    post:
      operationId: createProduct
      summary: Create a product aggregate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "../../shared/common-schemas.yaml#/components/responses/BadRequest" }
        "403": { $ref: "../../shared/common-schemas.yaml#/components/responses/Forbidden" }
        "422": { $ref: "../../shared/common-schemas.yaml#/components/responses/UnprocessableEntity" }
        "500": { $ref: "../../shared/common-schemas.yaml#/components/responses/InternalError" }

  /products/{id}:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProduct
      summary: Get a product by id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }
    put:
      operationId: updateProduct
      summary: Update a product and reconcile children
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "../../shared/common-schemas.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../shared/common-schemas.yaml#/components/responses/UnprocessableEntity" }
    delete:
      operationId: deleteProduct
      summary: Delete a product and cascade dependents
      responses:
        "204": { description: Deleted }
        "403": { $ref: "../../shared/common-schemas.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../shared/common-schemas.yaml#/components/responses/UnprocessableEntity" }

  /products/{id}/descriptions:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: addProductDescription
      summary: Add a localized product description
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DescriptionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Description" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../shared/common-schemas.yaml#/components/responses/UnprocessableEntity" }

  /products/{id}/availabilities:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: addAvailability
      summary: Add an availability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAvailabilityRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /products/{id}/availabilities/{availabilityId}:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: availabilityId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateAvailability
      summary: Update an availability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAvailabilityRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /products/{id}/digital-file:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDigitalFile
      summary: Get the product's downloadable file
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DigitalFile" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }
        "500": { $ref: "../../shared/common-schemas.yaml#/components/responses/InternalError" }
    post:
      operationId: attachDigitalFile
      summary: Attach a downloadable file and mark the product virtual
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachDigitalFileRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DigitalFile" }
        "409": { $ref: "../../shared/common-schemas.yaml#/components/responses/Conflict" }
        "422": { $ref: "../../shared/common-schemas.yaml#/components/responses/UnprocessableEntity" }
    delete:
      operationId: removeDigitalFile
      summary: Remove the downloadable file
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DigitalFile" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /products/{id}/relationships:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createRelationship
      summary: Create a product relationship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRelationshipRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relationship" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /products/{id}/relationships/{relationshipId}:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: relationshipId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateRelationship
      summary: Update a relationship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRelationshipRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relationship" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /storefront/products/{seUrl}:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: seUrl, in: path, required: true, schema: { type: string } }
      - { name: language_code, in: query, schema: { type: string } }
      - { name: region, in: query, schema: { type: string } }
    get:
      operationId: getStorefrontProduct
      summary: Storefront product read (visibility-gated, locale-trimmed)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /storefront/categories/{categoryId}/products:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: categoryId, in: path, required: true, schema: { type: string } }
      - { name: language_code, in: query, schema: { type: string } }
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/PageParam"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/PageSizeParam"
    get:
      operationId: listCategoryProducts
      summary: List products across a category lineage
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }
        "400": { $ref: "../../shared/common-schemas.yaml#/components/responses/BadRequest" }

  /product-types/{code}:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
