              schema: { $ref: "#/components/schemas/RelationshipGroup" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /relationship-groups/{code}/deactivate:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: code, in: path, required: true, schema: { type: string } }
    put:
      operationId: deactivateRelationshipGroup
      summary: Deactivate a group
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationshipGroup" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /relationship-groups/{code}:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: code, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteRelationshipGroup
      summary: Delete a group
      responses:
        "204": { description: Deleted }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /categories:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
    get:
      operationId: listCategories
      summary: List categories
      parameters:
        - { name: language_code, in: query, schema: { type: string } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListResponse" }
    post:
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "422": { $ref: "../../shared/common-schemas.yaml#/components/responses/UnprocessableEntity" }

  /categories/code-available:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
    get:
      operationId: checkCategoryCode
      summary: Check category code uniqueness
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeAvailability" }

  /categories/{id}:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateCategory
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "../../shared/common-schemas.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }
    delete:
      operationId: deleteCategory
      summary: Delete a category subtree and reconcile products
      responses:
        "204": { description: Deleted }
        "403": { $ref: "../../shared/common-schemas.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../shared/common-schemas.yaml#/components/responses/NotFound" }

  /categories/{id}/move:
    parameters:
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/TenantHeader"
      - $ref: "../../shared/common-schemas.yaml#/components/parameters/CorrelationHeader"
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: moveCategory
      summary: Reparent a category and its subtree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveCategoryRequest" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "../../shared/common-schemas.yaml#/components/responses/Forbidden" }
        "422": { $ref: "../../shared/common-schemas.yaml#/components/responses/UnprocessableEntity" }

