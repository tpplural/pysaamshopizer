# spec/test-config.yaml — Shared test environment configuration
# Generated by SAAM Phase 5 setup. Consumed by comprehensive test suites and service .env.test files.
# Ports match services-composition.md; DB/cache/broker match sourcecode/compose.yaml.

auth:
  jwt_secret: "saam-test-secret-do-not-use-in-production"
  jwt_issuer: "saam-test"
  jwt_audience: "shopizer"
  jwt_expiry_seconds: 315360000
  # Pre-signed HS256 token (sub=admin, store_id+tenant_id=11111111..., roles ADMIN+SUPERADMIN).
  test_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..VszzAqh2vrbIcQJVEWiIho9-9QFTrq7mG54NzkCD3qw"

# Tenancy: in Shopizer the store IS the tenant. Test store/tenant id is a UUID (infra-patterns rule).
tenancy:
  test_store_id: "11111111-1111-1111-1111-111111111111"
  test_tenant_id: "11111111-1111-1111-1111-111111111111"
  store_header: "x-store-id"
  tenant_header: "x-tenant-id"
  correlation_header: "x-correlation-id"

test_accounts:
  admin:
    id: "00000000-0000-4000-a000-000000000001"
    email: "admin@test.local"
    roles: ["ADMIN", "SUPERADMIN"]
  customer:
    id: "00000000-0000-4000-a000-000000000002"
    email: "customer@test.local"
    roles: ["CUSTOMER"]

services:
  # port + base_path + declared tenancy header per service (from each 04-api-contract.yaml x-global-headers).
  MS-01-reference-data: { port: 8001, base_path: "/api/v1/reference", headers: ["x-correlation-id"] }
  MS-02-identity-admin: { port: 8002, base_path: "/api/v1/identity",  headers: ["x-tenant-id"] }
  MS-03-merchant-store: { port: 8003, base_path: "/api/v1",           headers: ["x-tenant-id"] }
  MS-04-catalog:        { port: 8004, base_path: "/api/v1/catalog",   headers: ["x-tenant-id"] }
  MS-05-customer:       { port: 8005, base_path: "/api/v1",           headers: ["x-tenant-id", "x-store-id"] }
  MS-06-cart:           { port: 8006, base_path: "/api/v1/carts",     headers: ["x-tenant-id", "x-store-id", "x-correlation-id"] }
  MS-07-tax:            { port: 8007, base_path: "/api/v1/tax",       headers: ["x-tenant-id", "x-store-id"] }
  MS-08-shipping:       { port: 8008, base_path: "/api/v1/shipping",  headers: ["x-tenant-id"] }
  MS-09-order:          { port: 8009, base_path: "/api/v1/orders",    headers: ["x-tenant-id", "x-store-id"] }
  MS-10-payment:        { port: 8010, base_path: "/api/v1/payments",  headers: ["x-tenant-id", "x-store-id"] }
  MS-11-content-cms:    { port: 8011, base_path: "/api/v1/content",   headers: ["x-tenant-id", "x-store-id"] }

database:
  host: "localhost"
  port: 5432
  user: "saam"
  password: "saam_local"
  name: "shopizer_dev"
  # each service uses its own schema (see sourcecode/scripts/init-schemas.sql)

redis:
  host: "localhost"
  port: 6379

messaging:
  provider: "rabbitmq"
  host: "localhost"
  port: 5672
  user: "saam"
  password: "saam_local"

seed:
  script: "./scripts/seed-test-data.sh"
  reset_script: "./scripts/reset-test-data.sh"
